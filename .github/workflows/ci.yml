name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  browser:
    name: Browser and accessibility (axe, WCAG 2.2 AA)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save @playwright/test @axe-core/playwright
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [test, browser]
    # Production from main; a preview for pull requests from this repository.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Deploy
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
          else
            npx vercel@latest deploy --yes --token=${{ secrets.VERCEL_TOKEN }}
          fi
